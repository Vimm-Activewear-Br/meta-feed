# Hourly, token-free refresh of the Vimm Meta supplementary feed + dashboard.
# Reads the public storefront, rebuilds the CSV/status and commits only if something changed.
# Alerts that need Claude go to Slack/Todoist (secrets SLACK_WEBHOOK_URL, TODOIST_TOKEN).
name: Atualiza feed do Meta

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica a loja e refaz o feed
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          TODOIST_PROJECT: PROCESSOS
          TZ: America/Sao_Paulo
        run: python auto_refresh.py
      - name: Publica se mudou
        if: always()
        run: |
          git config user.name "Vimm meta feed (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Atualização automática do feed ($(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M'))"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin main && exit 0; sleep 5; done
          exit 1
